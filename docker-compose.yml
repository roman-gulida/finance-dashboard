services:

  mongodb:
    image: mongo:7
    container_name: finance-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: finance-dashboard
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: finance-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/finance-dashboard
      JWT_SECRET: docker-secret-change-in-production-abc123xyz
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:5173


  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: finance-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - server
    environment:
      VITE_API_URL: http://localhost:5000


  seed:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: finance-seed
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongodb:27017/finance-dashboard
    command: ["npm", "run", "seed"]
    restart: "no"
    profiles:
      - seed

volumes:
  mongodb_data:
    driver: local
